<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<script src="auth.js"></script>
<script src="sync.js"></script><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi diagnóstico · AIF-C01</title>
<style>
:root{--bg:#0f172a;--card:#111c33;--ink:#e2e8f0;--muted:#94a3b8;--accent:#ff9900;--ok:#22c55e;--bad:#ef4444;--line:#1e2a44}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
main{max-width:900px;margin:0 auto;padding:24px 16px 60px}h1{font-size:26px;color:var(--accent);margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
table.sum{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0 16px}table.sum th,table.sum td{border:1px solid var(--line);padding:7px 9px;text-align:left}table.sum th{background:var(--card);color:var(--accent)}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;z-index:2}
.bar button{background:#1e2a44;color:var(--ink);border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13.5px}.bar button.on{background:var(--accent);color:#111}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:12px;padding:16px 18px;margin:14px 0}.q.bad{border-left-color:var(--bad)}
.tag{font-size:12px;font-weight:700;letter-spacing:.3px}.q .tag{color:var(--ok)}.q.bad .tag{color:#fca5a5}
.stem{margin:6px 0 10px;font-size:15.5px}
.o{padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:14.5px}
.o.right{border-color:var(--ok);background:#10291c}.o.wrong{border-color:var(--bad);background:#2a1215}
.o .lbl{float:right;font-size:12px;font-weight:700}.o.right .lbl{color:var(--ok)}.o.wrong .lbl{color:#fca5a5}
.exp{margin-top:10px;padding:10px 12px;border-radius:8px;background:#0d1629;border-left:3px solid var(--accent);font-size:14.5px}.exp b{color:var(--accent)}
.meta{color:var(--muted);font-size:12.5px;margin-top:8px}
table.ord{width:100%;border-collapse:collapse;font-size:14px}table.ord td,table.ord th{border:1px solid var(--line);padding:6px 8px;text-align:left}table.ord th{color:var(--accent);background:#0d1629}
td.okc{color:#9be7b4}td.badc{color:#fca5a5}
</style></head><body><main>
<p><a href="index.html" style="color:#ff9900;font-weight:700">Inicio</a></p><h1>Mi diagnóstico</h1>
<p class="sub" id="when"></p><p class="sub">La correcta está en verde y, si fallaste, la tuya en rojo. Al terminar de revisar, regresa al Inicio para ver tu ruta ajustada. Lee la explicación de cada error: es lo que más te sirve para fijarlo.</p>
<div id="sum"></div>
<div class="bar" role="toolbar" aria-label="Filtros">
 <button type="button" data-f="bad" class="on">Solo mis errores</button><button type="button" data-f="all">Todas</button>
 <button type="button" data-f="D1">D1</button><button type="button" data-f="D2">D2</button><button type="button" data-f="D3">D3</button><button type="button" data-f="D4">D4</button><button type="button" data-f="D5">D5</button>
</div>
<div id="list"></div>
</main><script>
const Q = [
 {"d": "D3", "t": "mc", "s": "Una aseguradora quiere un asistente interno que responda preguntas de los agentes sobre sus pólizas. Las pólizas se actualizan cada semana y viven como PDFs en Amazon S3. La empresa quiere que las respuestas reflejen siempre la versión más reciente, sin reentrenar ningún modelo y con el menor esfuerzo operativo posible. ¿Qué solución cumple mejor estos requisitos?", "o": ["Hacer fine-tuning de un foundation model en Amazon Bedrock cada semana con los PDFs nuevos.", "Usar Amazon Bedrock Knowledge Bases con los PDFs de S3 como fuente de datos y sincronizarla cuando cambien.", "Hacer continued pre-training de un modelo con todo el histórico de pólizas.", "Entrenar un modelo propio desde cero en Amazon SageMaker AI con los PDFs."]},
 {"d": "D1", "t": "mc", "s": "Una cadena de tiendas tiene 3 años de historial de ventas diarias por sucursal: unidades vendidas, temperatura, día de la semana y si hubo promoción. Quiere estimar cuántas unidades de cada producto va a vender cada sucursal la próxima semana. ¿Qué tipo de problema de machine learning es?", "o": ["Clasificación supervisada", "Clustering (aprendizaje no supervisado)", "Regresión supervisada", "Aprendizaje por refuerzo"]},
 {"d": "D2", "t": "mc", "s": "Un chatbot de soporte construido sobre Amazon Bedrock responde de forma distinta cada vez que un cliente hace exactamente la misma pregunta. El equipo quiere respuestas más consistentes y predecibles, sin cambiar de modelo. ¿Qué ajuste de inferencia deben hacer?", "o": ["Subir la temperatura.", "Subir el número máximo de tokens de salida.", "Bajar la temperatura.", "Quitar el system prompt."]},
 {"d": "D2", "t": "mc", "s": "Una empresa usa un modelo de texto en Amazon Bedrock en modo on-demand. El director de finanzas pregunta qué es lo que más determina la factura mensual. ¿Cuál es la respuesta correcta?", "o": ["Las horas de GPU aprovisionadas por la empresa.", "El número de usuarios registrados en la aplicación.", "El tamaño del bucket de S3 donde están los documentos.", "La cantidad de tokens de entrada y de salida procesados."]},
 {"d": "D3", "t": "mc", "s": "Un equipo quiere probar varios foundation models de distintos proveedores (por ejemplo Anthropic, Meta y Amazon) llamándolos por una API única, sin administrar servidores, endpoints ni capacidad de GPU. ¿Qué servicio deben usar?", "o": ["Amazon SageMaker JumpStart, desplegando cada modelo en un endpoint propio.", "Instancias de Amazon EC2 con GPU y los modelos instalados a mano.", "Amazon Bedrock.", "Amazon Comprehend."]},
 {"d": "D3", "t": "mc", "s": "Una tienda en línea quiere un asistente que, además de conversar, consulte el estado real de un pedido en una API interna y, si el cliente lo pide, abra un ticket de devolución en otro sistema. ¿Qué capacidad de Amazon Bedrock resuelve mejor este requisito?", "o": ["Bedrock Knowledge Bases", "Bedrock Guardrails", "Bedrock Model Evaluation", "Bedrock Agents"]},
 {"d": "D4", "t": "mc", "s": "Un banco entrenó un modelo de aprobación de créditos en Amazon SageMaker AI. Antes de ponerlo en producción, el equipo de cumplimiento quiere saber si el modelo trata de forma desigual a ciertos grupos y qué variables pesan más en cada decisión. ¿Qué servicio deben usar?", "o": ["Amazon SageMaker Model Monitor", "Amazon SageMaker Clarify", "Amazon Macie", "AWS Config"]},
 {"d": "D5", "t": "mc", "s": "Durante una auditoría, el equipo de seguridad necesita saber qué usuario o rol de IAM invocó un modelo de Amazon Bedrock, a qué hora y desde qué dirección IP. ¿Qué servicio les da esa información?", "o": ["AWS Config", "AWS Trusted Advisor", "AWS CloudTrail", "Un dashboard de Amazon CloudWatch"]},
 {"d": "D1", "t": "mc", "s": "Un modelo de clasificación obtiene 98% de exactitud con los datos de entrenamiento, pero solo 70% con los datos de prueba que nunca había visto. ¿Qué describe mejor esta situación?", "o": ["Overfitting", "Underfitting", "Data drift en producción", "El modelo generaliza bien"]},
 {"d": "D3", "t": "mc", "s": "Un área de cuentas por pagar recibe miles de facturas escaneadas al mes y necesita extraer automáticamente el número de factura, el total y las líneas de la tabla de conceptos. ¿Qué servicio es el más directo?", "o": ["Amazon Rekognition", "Amazon Comprehend", "Amazon Transcribe", "Amazon Textract"]},
 {"d": "D2", "t": "multi", "s": "Un asistente corporativo a veces inventa datos sobre políticas internas que no existen. ¿Qué DOS acciones reducen mejor este problema? (Elige 2.)", "o": ["Subir la temperatura para que el modelo explore más opciones.", "Hacer grounding de las respuestas con RAG sobre los documentos oficiales.", "Quitar el system prompt para que el modelo responda con más libertad.", "Indicar en el prompt que responda que no sabe cuando la información no esté en el contexto.", "Aumentar el máximo de tokens de salida."], "n": 2},
 {"d": "D4", "t": "mc", "s": "Un modelo que clasifica reclamaciones de seguros tiene buena exactitud, pero la empresa exige que una persona revise los casos en los que el modelo tiene baja confianza antes de tomar la decisión final. ¿Qué servicio está diseñado para eso?", "o": ["Amazon SageMaker Ground Truth", "Amazon Augmented AI (Amazon A2I)", "Amazon SageMaker Clarify", "Amazon Comprehend"]},
 {"d": "D5", "t": "mc", "s": "El área legal de una empresa pregunta si los prompts y documentos que envían a Amazon Bedrock se usan para entrenar los foundation models base de los proveedores. ¿Cuál es la respuesta correcta?", "o": ["Sí, siempre se usan para mejorar los modelos.", "Solo si la cuenta está en la región us-east-1.", "No. Bedrock no usa los prompts ni las respuestas para entrenar los modelos base, y los datos se cifran.", "Solo cuando se contrata Provisioned Throughput."]},
 {"d": "D3", "t": "mc", "s": "Un equipo quiere medir de forma automática qué tan buenos son los resúmenes que genera un modelo, comparándolos contra resúmenes de referencia escritos por personas. ¿Qué métrica es la más adecuada?", "o": ["Accuracy", "RMSE", "ROUGE", "Coeficiente de silueta (silhouette)"]},
 {"d": "D1", "t": "mc", "s": "Una empresa de telecomunicaciones quiere agrupar a sus clientes en segmentos según su patrón de uso, pero no tiene ninguna etiqueta previa que diga a qué grupo pertenece cada cliente. ¿Qué técnica aplica?", "o": ["Clustering", "Clasificación", "Regresión", "Aprendizaje por refuerzo"]},
 {"d": "D2", "t": "mc", "s": "En una arquitectura de RAG, ¿qué son los embeddings?", "o": ["Una forma de cifrar los documentos antes de guardarlos.", "Vectores numéricos que representan el significado del contenido y permiten buscar por similitud.", "Un método para comprimir imágenes y ahorrar almacenamiento.", "El proceso de dividir el texto en tokens."]},
 {"d": "D3", "t": "mc", "s": "Un equipo necesita que el modelo siempre devuelva sus respuestas con un formato específico. En el prompt incluyen tres ejemplos completos de entrada y su salida esperada antes de la pregunta real. ¿Qué técnica están usando?", "o": ["Zero-shot prompting", "Chain-of-thought prompting", "Negative prompting", "Few-shot prompting"]},
 {"d": "D5", "t": "mc", "s": "Una empresa quiere que solo el rol de IAM de su aplicación de producción pueda invocar un modelo específico de Amazon Bedrock, y nadie más. ¿Cuál es la forma correcta de lograrlo?", "o": ["Configurar Bedrock Guardrails para bloquear a otros usuarios.", "Cifrar el modelo con una llave de AWS KMS.", "Una política de IAM que permita bedrock:InvokeModel solo sobre el ARN de ese modelo y asignarla a ese rol.", "Activar Amazon Macie en la cuenta."]},
 {"d": "D4", "t": "mc", "s": "Un banco lanza un asistente generativo para clientes. Debe bloquear cualquier respuesta que dé asesoría de inversión y debe ocultar datos personales (PII) si aparecen en la conversación. ¿Qué servicio cubre ambos requisitos?", "o": ["Amazon Bedrock Guardrails", "AWS IAM", "AWS CloudTrail", "Amazon Comprehend"]},
 {"d": "D3", "t": "mc", "s": "Cada noche una empresa necesita resumir 50,000 documentos con un modelo de Amazon Bedrock. Nadie espera los resultados en tiempo real; los quieren listos en la mañana y al menor costo posible. ¿Qué opción conviene?", "o": ["Llamadas on-demand en tiempo real, una por documento.", "Contratar Provisioned Throughput.", "Batch inference.", "Cambiar a un modelo más grande para terminar más rápido."]}
];
const KEYA = {"1": "B", "2": "C", "3": "C", "4": "D", "5": "C", "6": "D", "7": "B", "8": "C", "9": "A", "10": "D", "11": "BD", "12": "B", "13": "C", "14": "C", "15": "A", "16": "B", "17": "D", "18": "C", "19": "A", "20": "C"};
const ST = JSON.parse(localStorage.getItem("jair-diagnostico")||"null");
const MINE = (ST&&ST.a)||{};
const SEC = (ST&&ST.sec)||{};
const EXP = {"1": "Pólizas que cambian cada semana, sin reentrenar y con poco esfuerzo: RAG con Bedrock Knowledge Bases. Fine-tuning y continued pre-training son reentrenar.", "2": "\"Cuántas unidades\" es un número: regresión. Clasificación es para categorías.", "3": "Para respuestas más consistentes se BAJA la temperatura. Subirla da más variedad y más riesgo de inventar.", "4": "En on-demand, Bedrock cobra por los tokens de entrada y de salida que procesas.", "5": "Bedrock da varios FMs por una sola API, sin administrar servidores. JumpStart despliega cada modelo en tu propio endpoint.", "6": "Consultar una API y abrir un ticket son acciones en varios pasos: Bedrock Agents. Knowledge Bases solo responde con documentos.", "7": "Revisar si el modelo trata distinto a un grupo y qué variables pesan: SageMaker Clarify (sesgo y explicabilidad).", "8": "Quién invocó, a qué hora y desde qué IP: CloudTrail registra cada llamada a la API. Config es configuración; Trusted Advisor solo recomienda.", "9": "98% en entrenamiento y 70% en prueba: memorizó y no generaliza. Es overfitting.", "10": "Facturas escaneadas con tablas y campos: Textract. Transcribe convierte audio a texto.", "11": "Grounding con RAG y pedir que diga \"no sé\" cuando no esté en el contexto. Subir la temperatura o quitar el system prompt empeora las alucinaciones.", "12": "Una persona revisa los casos de baja confianza en producción: Amazon A2I. Ground Truth es para etiquetar datos antes de entrenar.", "13": "Bedrock no usa tus prompts ni respuestas para entrenar los modelos base, y cifra los datos.", "14": "Comparar resúmenes contra resúmenes de referencia: ROUGE. Para traducciones es BLEU.", "15": "Sin etiquetas y queriendo formar grupos: clustering. No se puede clasificar sin etiquetas.", "16": "Los embeddings son vectores que representan el significado y permiten buscar por similitud.", "17": "Dar ejemplos completos de entrada y salida en el prompt es few-shot. Zero-shot es sin ejemplos.", "18": "Una política de IAM que permita bedrock:InvokeModel solo sobre ese modelo, asignada a ese rol. Guardrails no controla permisos.", "19": "Bloquear temas y ocultar PII en un asistente generativo: Bedrock Guardrails. Comprehend detecta PII pero no bloquea respuestas.", "20": "50,000 documentos cada noche, sin prisa y al menor costo: batch inference. Provisioned Throughput es capacidad reservada y cara."};
const DN = {D1:"Fundamentos de IA y ML",D2:"Fundamentos de IA generativa",D3:"Aplicaciones de foundation models",D4:"IA responsable",D5:"Seguridad, cumplimiento y gobernanza"};
const L="ABCDE";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
if(!ST||!ST.done){ document.querySelector("main").innerHTML='<p><a href="index.html" style="color:#ff9900;font-weight:700">Inicio</a></p><h1>Todavía no terminas el diagnóstico</h1><p class="sub">Cuando lo termines, aquí verás tu calificación y las explicaciones.</p><p><a href="diagnostico.html" style="color:#ff9900;font-weight:700">Ir al diagnóstico</a></p>'; throw new Error("sin simulacro"); }
const ok = Q.map((q,i)=>(MINE[i+1]||"")===KEYA[i+1]);
// resumen
const dom={}; Q.forEach((q,i)=>{const d=dom[q.d]||(dom[q.d]={ok:0,n:0}); d.n++; if(ok[i]) d.ok++;});
const tot=ok.filter(Boolean).length;
document.getElementById("when").innerHTML='Tiempo usado: <b>'+(function(s){s=Math.round(s/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")})(ST.base||0)+'</b> de 30:00. <button type="button" id="again" style="margin-left:10px;background:#1e2a44;color:#e2e8f0;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700">Repetir diagnóstico</button>';
document.getElementById("again").onclick=function(){ if(confirm("¿Repetir el diagnóstico desde cero? Se borra este resultado de este navegador. Si quieres conservarlo, primero descarga tu respaldo en el Inicio.")){ localStorage.removeItem("jair-diagnostico"); location.href="diagnostico.html"; } };
try{ var r=JSON.parse(localStorage.getItem("jair-scores")||"{}"); r.simulacro1={ok:ok.filter(Boolean).length,total:Q.length,fecha:new Date().toISOString()}; }catch(e){}
document.getElementById("sum").innerHTML='<table class="sum"><thead><tr><th>Dominio</th><th>Correctas</th><th>%</th></tr></thead><tbody>'+
 Object.keys(dom).map(k=>'<tr><td>'+k+' · '+DN[k]+'</td><td>'+dom[k].ok+' de '+dom[k].n+'</td><td>'+Math.round(100*dom[k].ok/dom[k].n)+'%</td></tr>').join("")+
 '<tr><td><b>Total</b></td><td><b>'+tot+' de '+Q.length+'</b></td><td><b>'+Math.round(100*tot/Q.length)+'%</b></td></tr></tbody></table>';
function card(q,i){
 const n=i+1, mine=MINE[n]||"", right=KEYA[n], good=ok[i];
 let h='<section class="q'+(good?"":" bad")+'"><div class="tag">Pregunta '+n+' · '+q.d+' · '+(good?"Correcta":"Incorrecta")+'</div><p class="stem">'+esc(q.s)+'</p>';
 if(q.t==="mc"||q.t==="multi"){
  q.o.forEach((o,j)=>{const isR=right.includes(L[j]), isM=mine.includes(L[j]); let c="o"+(isR?" right":(isM?" wrong":""));
   let lbl=isR&&isM?"Correcta · tu respuesta":isR?"Correcta":isM?"Tu respuesta":"";
   h+='<div class="'+c+'">'+(lbl?'<span class="lbl">'+lbl+'</span>':'')+'<b>'+L[j]+')</b> '+esc(o)+'</div>';});
 } else if(q.t==="order"){
  const mp=mine.split("-");
  h+='<table class="ord"><thead><tr><th>Orden correcto</th><th>Paso</th><th>Tu posición</th></tr></thead><tbody>'+
   q.steps.map((s,k)=>'<tr><td>'+(k+1)+'</td><td>'+esc(s)+'</td><td class="'+(mp[k]==String(k+1)?"okc":"badc")+'">'+(mp[k]||"-")+'</td></tr>').join("")+'</tbody></table>';
 } else {
  const mp=mine.split("-");
  h+='<table class="ord"><thead><tr><th>Necesidad</th><th>Correcto</th><th>Tu respuesta</th></tr></thead><tbody>'+
   q.pairs.map((p,k)=>{const m=+mp[k]; const txt=m?q.pairs[m-1][1]:"-"; return '<tr><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td><td class="'+(m===k+1?"okc":"badc")+'">'+esc(txt)+'</td></tr>';}).join("")+'</tbody></table>';
 }
 h+='<div class="exp"><b>Por qué:</b> '+esc(EXP[n])+'</div><div class="meta">Tardaste '+(SEC[n]||0)+' s en esta pregunta.</div></section>';
 return h;
}
function render(f){
 document.getElementById("list").innerHTML=Q.map((q,i)=>({q,i})).filter(({q,i})=>f==="all"?true:f==="bad"?!ok[i]:q.d===f).map(({q,i})=>card(q,i)).join("");
}
document.querySelectorAll(".bar button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".bar button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render(b.dataset.f);});
render("bad");
</script></body></html>
