<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="auth.js"></script>
<script src="sync.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico · AIF-C01 · 20 preguntas</title>
<style>
  :root { --bg:#0f172a; --card:#111c33; --ink:#e2e8f0; --muted:#94a3b8; --accent:#ff9900; --ok:#22c55e; --bad:#ef4444; --line:#1e2a44; --flag:#eab308; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  .wrap { padding-top:44px !important; max-width:860px; margin:0 auto; padding:16px 16px 60px; }
  header { display:flex; align-items:center; gap:14px; padding:10px 0 14px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
  .ttl { font-weight:800; flex:1; }
  .timer { font-variant-numeric:tabular-nums; font-weight:800; font-size:18px; padding:6px 12px; border-radius:8px; background:#1e2a44; }
  .timer.low { background:#7f1d1d; }
  .ico { display:inline-block; width:1em; height:1em; vertical-align:-0.125em; margin-right:5px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; }
  .kind { font-size:12px; color:var(--accent); font-weight:700; letter-spacing:.4px; }
  h1 { font-size:24px; margin:0 0 8px; }
  .stem { font-size:16px; margin:8px 0 14px; }
  .note { font-size:13px; color:var(--accent); margin:-6px 0 12px; }
  p.muted, li.muted { color:var(--muted); }
  label.opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; cursor:pointer; }
  label.opt:hover { border-color:#334366; }
  label.opt.sel { border-color:var(--accent); background:#1a2540; }
  label.opt input { margin-top:4px; accent-color:var(--accent); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  select { background:#0d1629; color:var(--ink); border:1px solid #334366; border-radius:8px; padding:8px; font-size:14px; width:100%; }
  .nav { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; align-items:center; }
  .sp { flex:1; }
  .btn { background:var(--accent); color:#111; border:0; border-radius:9px; padding:10px 16px; font-weight:800; font-size:14px; cursor:pointer; }
  .btn.sec { background:#1e2a44; color:var(--ink); }
  .btn.flag.on { background:var(--flag); color:#111; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .pal { display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:6px; margin-top:12px; }
  .pal button { background:#0d1629; color:var(--muted); border:1px solid var(--line); border-radius:7px; padding:7px 0; cursor:pointer; font-weight:700; font-size:13px; }
  .pal button.ans { background:#1a2540; color:var(--ink); border-color:#334366; }
  .pal button.flg { border-color:var(--flag); color:var(--flag); }
  .pal button.cur { outline:2px solid var(--accent); }
  .legend { font-size:12.5px; color:var(--muted); margin-top:8px; }
  details { margin-top:16px; }
  summary { cursor:pointer; color:var(--accent); font-weight:700; font-size:14px; }
  #msg { color:var(--ok); font-size:13px; margin-top:8px; min-height:1em; }
  table { width:100%; border-collapse:collapse; font-size:14px; margin-top:12px; }
  th,td { border:1px solid var(--line); padding:7px 9px; text-align:left; }
  th { background:#0d1629; color:var(--accent); }
</style>
</head>
<body>
<a href="index.html#material" style="position:fixed;top:10px;left:12px;z-index:50;background:#1e2a44;color:#e2e8f0;text-decoration:none;font:700 13px -apple-system,BlinkMacSystemFont,sans-serif;padding:7px 11px;border-radius:8px">Inicio</a>

<div class="wrap">
  <header>
    <div class="ttl">Diagnóstico · AIF-C01</div>
    <div class="timer" id="timer" aria-label="Tiempo restante">30:00</div>
  </header>
  <main id="app"></main>
</div>

<script>
const Q = [
 {"d": "D3", "t": "mc", "s": "Una aseguradora quiere un asistente interno que responda preguntas de los agentes sobre sus pólizas. Las pólizas se actualizan cada semana y viven como PDFs en Amazon S3. La empresa quiere que las respuestas reflejen siempre la versión más reciente, sin reentrenar ningún modelo y con el menor esfuerzo operativo posible. ¿Qué solución cumple mejor estos requisitos?", "o": ["Hacer fine-tuning de un foundation model en Amazon Bedrock cada semana con los PDFs nuevos.", "Usar Amazon Bedrock Knowledge Bases con los PDFs de S3 como fuente de datos y sincronizarla cuando cambien.", "Hacer continued pre-training de un modelo con todo el histórico de pólizas.", "Entrenar un modelo propio desde cero en Amazon SageMaker AI con los PDFs."]},
 {"d": "D1", "t": "mc", "s": "Una cadena de tiendas tiene 3 años de historial de ventas diarias por sucursal: unidades vendidas, temperatura, día de la semana y si hubo promoción. Quiere estimar cuántas unidades de cada producto va a vender cada sucursal la próxima semana. ¿Qué tipo de problema de machine learning es?", "o": ["Clasificación supervisada", "Clustering (aprendizaje no supervisado)", "Regresión supervisada", "Aprendizaje por refuerzo"]},
 {"d": "D2", "t": "mc", "s": "Un chatbot de soporte construido sobre Amazon Bedrock responde de forma distinta cada vez que un cliente hace exactamente la misma pregunta. El equipo quiere respuestas más consistentes y predecibles, sin cambiar de modelo. ¿Qué ajuste de inferencia deben hacer?", "o": ["Subir la temperatura.", "Subir el número máximo de tokens de salida.", "Bajar la temperatura.", "Quitar el system prompt."]},
 {"d": "D2", "t": "mc", "s": "Una empresa usa un modelo de texto en Amazon Bedrock en modo on-demand. El director de finanzas pregunta qué es lo que más determina la factura mensual. ¿Cuál es la respuesta correcta?", "o": ["Las horas de GPU aprovisionadas por la empresa.", "El número de usuarios registrados en la aplicación.", "El tamaño del bucket de S3 donde están los documentos.", "La cantidad de tokens de entrada y de salida procesados."]},
 {"d": "D3", "t": "mc", "s": "Un equipo quiere probar varios foundation models de distintos proveedores (por ejemplo Anthropic, Meta y Amazon) llamándolos por una API única, sin administrar servidores, endpoints ni capacidad de GPU. ¿Qué servicio deben usar?", "o": ["Amazon SageMaker JumpStart, desplegando cada modelo en un endpoint propio.", "Instancias de Amazon EC2 con GPU y los modelos instalados a mano.", "Amazon Bedrock.", "Amazon Comprehend."]},
 {"d": "D3", "t": "mc", "s": "Una tienda en línea quiere un asistente que, además de conversar, consulte el estado real de un pedido en una API interna y, si el cliente lo pide, abra un ticket de devolución en otro sistema. ¿Qué capacidad de Amazon Bedrock resuelve mejor este requisito?", "o": ["Bedrock Knowledge Bases", "Bedrock Guardrails", "Bedrock Model Evaluation", "Bedrock Agents"]},
 {"d": "D4", "t": "mc", "s": "Un banco entrenó un modelo de aprobación de créditos en Amazon SageMaker AI. Antes de ponerlo en producción, el equipo de cumplimiento quiere saber si el modelo trata de forma desigual a ciertos grupos y qué variables pesan más en cada decisión. ¿Qué servicio deben usar?", "o": ["Amazon SageMaker Model Monitor", "Amazon SageMaker Clarify", "Amazon Macie", "AWS Config"]},
 {"d": "D5", "t": "mc", "s": "Durante una auditoría, el equipo de seguridad necesita saber qué usuario o rol de IAM invocó un modelo de Amazon Bedrock, a qué hora y desde qué dirección IP. ¿Qué servicio les da esa información?", "o": ["AWS Config", "AWS Trusted Advisor", "AWS CloudTrail", "Un dashboard de Amazon CloudWatch"]},
 {"d": "D1", "t": "mc", "s": "Un modelo de clasificación obtiene 98% de exactitud con los datos de entrenamiento, pero solo 70% con los datos de prueba que nunca había visto. ¿Qué describe mejor esta situación?", "o": ["Overfitting", "Underfitting", "Data drift en producción", "El modelo generaliza bien"]},
 {"d": "D3", "t": "mc", "s": "Un área de cuentas por pagar recibe miles de facturas escaneadas al mes y necesita extraer automáticamente el número de factura, el total y las líneas de la tabla de conceptos. ¿Qué servicio es el más directo?", "o": ["Amazon Rekognition", "Amazon Comprehend", "Amazon Transcribe", "Amazon Textract"]},
 {"d": "D2", "t": "multi", "s": "Un asistente corporativo a veces inventa datos sobre políticas internas que no existen. ¿Qué DOS acciones reducen mejor este problema? (Elige 2.)", "o": ["Subir la temperatura para que el modelo explore más opciones.", "Hacer grounding de las respuestas con RAG sobre los documentos oficiales.", "Quitar el system prompt para que el modelo responda con más libertad.", "Indicar en el prompt que responda que no sabe cuando la información no esté en el contexto.", "Aumentar el máximo de tokens de salida."], "n": 2},
 {"d": "D4", "t": "mc", "s": "Un modelo que clasifica reclamaciones de seguros tiene buena exactitud, pero la empresa exige que una persona revise los casos en los que el modelo tiene baja confianza antes de tomar la decisión final. ¿Qué servicio está diseñado para eso?", "o": ["Amazon SageMaker Ground Truth", "Amazon Augmented AI (Amazon A2I)", "Amazon SageMaker Clarify", "Amazon Comprehend"]},
 {"d": "D5", "t": "mc", "s": "El área legal de una empresa pregunta si los prompts y documentos que envían a Amazon Bedrock se usan para entrenar los foundation models base de los proveedores. ¿Cuál es la respuesta correcta?", "o": ["Sí, siempre se usan para mejorar los modelos.", "Solo si la cuenta está en la región us-east-1.", "No. Bedrock no usa los prompts ni las respuestas para entrenar los modelos base, y los datos se cifran.", "Solo cuando se contrata Provisioned Throughput."]},
 {"d": "D3", "t": "mc", "s": "Un equipo quiere medir de forma automática qué tan buenos son los resúmenes que genera un modelo, comparándolos contra resúmenes de referencia escritos por personas. ¿Qué métrica es la más adecuada?", "o": ["Accuracy", "RMSE", "ROUGE", "Coeficiente de silueta (silhouette)"]},
 {"d": "D1", "t": "mc", "s": "Una empresa de telecomunicaciones quiere agrupar a sus clientes en segmentos según su patrón de uso, pero no tiene ninguna etiqueta previa que diga a qué grupo pertenece cada cliente. ¿Qué técnica aplica?", "o": ["Clustering", "Clasificación", "Regresión", "Aprendizaje por refuerzo"]},
 {"d": "D2", "t": "mc", "s": "En una arquitectura de RAG, ¿qué son los embeddings?", "o": ["Una forma de cifrar los documentos antes de guardarlos.", "Vectores numéricos que representan el significado del contenido y permiten buscar por similitud.", "Un método para comprimir imágenes y ahorrar almacenamiento.", "El proceso de dividir el texto en tokens."]},
 {"d": "D3", "t": "mc", "s": "Un equipo necesita que el modelo siempre devuelva sus respuestas con un formato específico. En el prompt incluyen tres ejemplos completos de entrada y su salida esperada antes de la pregunta real. ¿Qué técnica están usando?", "o": ["Zero-shot prompting", "Chain-of-thought prompting", "Negative prompting", "Few-shot prompting"]},
 {"d": "D5", "t": "mc", "s": "Una empresa quiere que solo el rol de IAM de su aplicación de producción pueda invocar un modelo específico de Amazon Bedrock, y nadie más. ¿Cuál es la forma correcta de lograrlo?", "o": ["Configurar Bedrock Guardrails para bloquear a otros usuarios.", "Cifrar el modelo con una llave de AWS KMS.", "Una política de IAM que permita bedrock:InvokeModel solo sobre el ARN de ese modelo y asignarla a ese rol.", "Activar Amazon Macie en la cuenta."]},
 {"d": "D4", "t": "mc", "s": "Un banco lanza un asistente generativo para clientes. Debe bloquear cualquier respuesta que dé asesoría de inversión y debe ocultar datos personales (PII) si aparecen en la conversación. ¿Qué servicio cubre ambos requisitos?", "o": ["Amazon Bedrock Guardrails", "AWS IAM", "AWS CloudTrail", "Amazon Comprehend"]},
 {"d": "D3", "t": "mc", "s": "Cada noche una empresa necesita resumir 50,000 documentos con un modelo de Amazon Bedrock. Nadie espera los resultados en tiempo real; los quieren listos en la mañana y al menor costo posible. ¿Qué opción conviene?", "o": ["Llamadas on-demand en tiempo real, una por documento.", "Contratar Provisioned Throughput.", "Batch inference.", "Cambiar a un modelo más grande para terminar más rápido."]}
];
const LIMIT = 30*60*1000;
const KEY = "jair-diagnostico";
const L = "ABCDE";
let st = JSON.parse(localStorage.getItem(KEY) || "null") || {started:false, done:false, idx:0, base:0, a:{}, f:{}, sec:{}, perm:{}};
let runFrom=null, qFrom=null, tick=null;

// Orden aleatorio fijo por examen para los elementos de ordenar y emparejar
Q.forEach((q,i)=>{ if((q.t==="order"||q.t==="match") && !st.perm[i]){ const n=(q.steps||q.pairs).length; st.perm[i]=shuffle([...Array(n).keys()]); } });

function save(){ localStorage.setItem(KEY, JSON.stringify(st)); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function elapsed(){ return st.base + (runFrom ? Date.now()-runFrom : 0); }
function fmt(ms){ const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function addQTime(){ if(qFrom!==null){ const k=st.idx+1; st.sec[k]=(st.sec[k]||0)+Math.round((elapsed()-qFrom)/1000); qFrom=elapsed(); } }
function updTimer(){ const left=LIMIT-elapsed(); const t=document.getElementById("timer"); t.textContent=fmt(left); t.classList.toggle("low", left<10*60*1000); if(left<=0 && !st.done){ finishExam(true); } }
function startClock(){ runFrom=Date.now(); qFrom=elapsed(); tick=setInterval(updTimer,500); updTimer(); }
function stopClock(){ addQTime(); st.base=elapsed(); runFrom=null; qFrom=null; clearInterval(tick); save(); }
window.addEventListener("beforeunload", ()=>{ if(runFrom){ addQTime(); st.base=elapsed(); save(); } });
const app=document.getElementById("app");

function answered(i){
  const q=Q[i], v=st.a[i+1]||"";
  if(q.t==="mc") return v.length===1;
  if(q.t==="multi") return v.length===q.n;
  const n=(q.steps||q.pairs).length; return v.split("-").filter(x=>x).length===n && !v.split("-").includes("0");
}
function nAnswered(){ return Q.filter((q,i)=>answered(i)).length; }

function intro(){
  app.innerHTML='<div class="card"><div class="kind">Paso 0 · Diagnóstico</div><h1>20 preguntas · 30 minutos</h1>'+
  '<ul><li class="muted">Sirve para ver de dónde partes. No importa si no sabes las respuestas: contesta lo que creas y sigue.</li>'+
  '<li class="muted">Cubre los 5 dominios del examen. Al terminar, el Inicio te arma tu ruta: qué pasos son prioridad y cuáles puedes ir rápido.</li>'+
  '<li class="muted">No verás respuestas hasta que te califique. Puedes marcar preguntas para revisarlas y moverte libremente entre ellas.</li>'+
  '<li class="muted">El timer cuenta hacia atrás desde 30:00 al dar clic en Iniciar. Al llegar a cero, el examen se cierra solo. Se guarda el tiempo total y el de cada pregunta.</li>'+
  '<li class="muted">Si cierras la pestaña, el tiempo se pausa y sigues donde te quedaste. Para que cuente como examen real, hazlo de corrido.</li></ul>'+
  '<div class="nav"><span class="sp"></span><button class="btn" id="go">Iniciar</button></div></div>';
  document.getElementById("go").onclick=()=>{ st.started=true; save(); startClock(); show(); };
}

function show(){
  const i=st.idx, q=Q[i], n=i+1, v=st.a[n]||"";
  let h='<div class="card"><div class="kind">Pregunta '+n+' de '+Q.length+'</div><p class="stem" id="stem">'+esc(q.s)+'</p>';
  if(q.t==="multi") h+='<p class="note">Respuesta múltiple: elige '+q.n+'.</p>';
  if(q.t==="mc"||q.t==="multi"){
    h+='<div role="group" aria-labelledby="stem">';
    q.o.forEach((o,j)=>{ const on=v.includes(L[j]); h+='<label class="opt'+(on?" sel":"")+'"><input type="'+(q.t==="mc"?"radio":"checkbox")+'" name="r" value="'+L[j]+'"'+(on?" checked":"")+'><span><b>'+L[j]+')</b> '+esc(o)+'</span></label>'; });
    h+='</div>';
  } else if(q.t==="order"){
    h+='<p class="note">Asigna a cada paso su posición (1 = primero).</p>';
    const cur=v?v.split("-"):[]; const items=q.steps, perm=st.perm[i];
    perm.forEach(k=>{ const sel=cur[k]||"0"; h+='<div class="row"><div>'+esc(items[k])+'</div><select data-k="'+k+'" aria-label="Posición de: '+esc(items[k])+'"><option value="0">Elige posición</option>'+items.map((x,p)=>'<option value="'+(p+1)+'"'+(String(p+1)===sel?" selected":"")+'>'+(p+1)+'</option>').join("")+'</select></div>'; });
  } else {
    h+='<p class="note">Elige el servicio que corresponde a cada necesidad. Cada servicio se usa una vez.</p>';
    const cur=v?v.split("-"):[]; const perm=st.perm[i];
    q.pairs.forEach((p,k)=>{ const sel=cur[k]||"0"; h+='<div class="row"><div>'+esc(p[0])+'</div><select data-k="'+k+'" aria-label="Servicio para: '+esc(p[0])+'"><option value="0">Elige un servicio</option>'+perm.map(r=>'<option value="'+(r+1)+'"'+(String(r+1)===sel?" selected":"")+'>'+esc(q.pairs[r][1])+'</option>').join("")+'</select></div>'; });
  }
  h+='<div class="nav"><button class="btn sec" id="prev"'+(i===0?" disabled":"")+'>Anterior</button><button class="btn sec flag'+(st.f[n]?" on":"")+'" id="flag" aria-pressed="'+(st.f[n]?"true":"false")+'">'+(st.f[n]?"Marcada para revisar":"Marcar para revisar")+'</button><span class="sp"></span>'+
     (i<Q.length-1?'<button class="btn" id="next">Siguiente</button>':'<button class="btn" id="end">Terminar examen</button>')+'</div>';
  h+='<details'+(st.openPal?" open":"")+'><summary>Ver todas las preguntas ('+nAnswered()+' de '+Q.length+' contestadas)</summary><div class="pal" id="pal"></div><p class="legend">Contestada = fondo claro. Marcada = borde amarillo. <span class="sp"></span></p><div class="nav"><span class="sp"></span><button class="btn sec" id="end2">Terminar examen</button></div></details></div>';
  app.innerHTML=h;

  if(q.t==="mc"||q.t==="multi"){
    app.querySelectorAll('input[name="r"]').forEach(inp=>inp.addEventListener("change",()=>{
      let val=[...app.querySelectorAll('input[name="r"]:checked')].map(x=>x.value).join("");
      if(q.t==="multi" && val.length>q.n){ inp.checked=false; val=val.replace(inp.value,""); }
      st.a[n]=val; save();
      app.querySelectorAll("label.opt").forEach(lb=>lb.classList.toggle("sel", lb.querySelector("input").checked)); drawPal();
    }));
  } else {
    app.querySelectorAll("select").forEach(s=>s.addEventListener("change",()=>{
      const len=(q.steps||q.pairs).length; const cur=(st.a[n]||Array(len).fill("0").join("-")).split("-");
      cur[+s.dataset.k]=s.value; st.a[n]=cur.join("-"); save(); drawPal();
    }));
  }
  const go=k=>{ addQTime(); st.idx=k; save(); show(); window.scrollTo(0,0); };
  document.getElementById("prev").onclick=()=>go(i-1);
  if(document.getElementById("next")) document.getElementById("next").onclick=()=>go(i+1);
  document.getElementById("flag").onclick=()=>{ st.f[n]=!st.f[n]; save(); show(); };
  const ask=()=>{ const miss=Q.length-nAnswered(); const fl=Object.values(st.f).filter(Boolean).length;
    if(confirm("¿Terminar el examen?"+(miss?"\nTe faltan "+miss+" pregunta(s) sin contestar.":"")+(fl?"\nTienes "+fl+" pregunta(s) marcadas para revisar.":""))) finishExam(false); };
  if(document.getElementById("end")) document.getElementById("end").onclick=ask;
  document.getElementById("end2").onclick=ask;
  app.querySelector("details").addEventListener("toggle",e=>{ st.openPal=e.target.open; save(); });
  drawPal();
  function drawPal(){
    const pal=document.getElementById("pal"); pal.innerHTML="";
    Q.forEach((qq,k)=>{ const b=document.createElement("button"); b.textContent=k+1; b.type="button";
      if(answered(k)) b.classList.add("ans"); if(st.f[k+1]) b.classList.add("flg"); if(k===i) b.classList.add("cur");
      b.setAttribute("aria-label","Pregunta "+(k+1)+(answered(k)?", contestada":", sin contestar")+(st.f[k+1]?", marcada":""));
      b.onclick=()=>go(k); pal.appendChild(b); });
    app.querySelector("summary").textContent="Ver todas las preguntas ("+nAnswered()+" de "+Q.length+" contestadas)";
  }
}

function resultText(){
  return "Diagnóstico AIF-C01\nTiempo usado: "+fmt(st.base)+" de 30:00\nContestadas: "+nAnswered()+" de "+Q.length+"\n"+
    Q.map((q,i)=>{ const n=i+1; return n+": "+(st.a[n]||"-")+" · "+(st.sec[n]||0)+" s"+(st.f[n]?" · marcada":""); }).join("\n");
}
function finishExam(auto){
  if(!st.done){ stopClock(); st.done=true; st.auto=!!auto; save(); }
  const fl=Object.keys(st.f).filter(k=>st.f[k]).length;
  const dom={D1:[0,0],D2:[0,0],D3:[0,0],D4:[0,0],D5:[0,0]};
  Q.forEach((q,i)=>{ dom[q.d][0]++; dom[q.d][1]+=(st.sec[i+1]||0); });
  app.innerHTML='<div class="card"><div class="kind">Examen terminado'+(st.auto?" · se acabó el tiempo":"")+'</div><h1>Listo</h1>'+
   '<p class="muted">Tiempo usado: <b style="color:#e2e8f0">'+fmt(st.base)+'</b> de 30:00 · Contestadas: <b style="color:#e2e8f0">'+nAnswered()+' de '+Q.length+'</b> · Marcadas: '+fl+'</p>'+
   '<table><thead><tr><th>Dominio</th><th>Preguntas</th><th>Tiempo total</th></tr></thead><tbody>'+
   Object.keys(dom).map(k=>'<tr><td>'+k+'</td><td>'+dom[k][0]+'</td><td>'+fmt(dom[k][1]*1000)+'</td></tr>').join("")+'</tbody></table>'+
   '<p class="muted">Ya está calificado. Revisa tus respuestas y luego regresa al Inicio: ahí verás tu ruta ajustada.</p><div class="nav"><a class="btn" href="diagnostico-revision.html" style="text-decoration:none">Ver mi calificación y respuestas</a></div>'+
   '<div class="nav"><span class="sp"></span><button class="btn sec" id="sv">Guardar archivo</button><button class="btn" id="cp">Copiar resultados</button></div><div id="msg" role="status"></div></div>';
  document.getElementById("timer").textContent="Fin";
  const msg=t=>document.getElementById("msg").textContent=t;
  document.getElementById("cp").onclick=async()=>{ try{ await navigator.clipboard.writeText(resultText()); msg("Copiado."); }catch(e){ prompt("Copia este texto:",resultText()); } };
  document.getElementById("sv").onclick=async()=>{
    const data=JSON.stringify({examen:"diagnostico", fecha:new Date().toISOString(), tiempo_usado_seg:Math.round(st.base/1000), tiempo_usado:fmt(st.base), se_acabo_el_tiempo:!!st.auto, respuestas:st.a, segundos_por_pregunta:st.sec, marcadas:st.f},null,2);
    try{ if(window.showSaveFilePicker){ const h=await window.showSaveFilePicker({suggestedName:"respuestas-diagnostico.json",types:[{description:"JSON",accept:{"application/json":[".json"]}}]}); const w=await h.createWritable(); await w.write(data); await w.close(); }
      else { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download="respuestas-diagnostico.json"; a.click(); }
      msg("Archivo guardado."); }catch(e){ if(e.name!=="AbortError") msg("No se pudo guardar: usa Copiar resultados."); }
  };
}

save();
if(!st.started) intro();
else if(st.done) finishExam(st.auto);
else { startClock(); show(); }
</script>
</body>
</html>
