<style>
:root{--bg:#0f172a;--card:#111c33;--ink:#e2e8f0;--muted:#94a3b8;--accent:#ff9900;--ok:#22c55e;--bad:#ef4444;--line:#1e2a44}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
main{max-width:900px;margin:0 auto;padding:24px 16px 60px}h1{font-size:26px;color:var(--accent);margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
table.sum{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0 16px}table.sum th,table.sum td{border:1px solid var(--line);padding:7px 9px;text-align:left}table.sum th{background:var(--card);color:var(--accent)}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;z-index:2}
.bar button{background:#1e2a44;color:var(--ink);border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13.5px}.bar button.on{background:var(--accent);color:#111}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:12px;padding:16px 18px;margin:14px 0}.q.bad{border-left-color:var(--bad)}
.tag{font-size:12px;font-weight:700;letter-spacing:.3px}.q .tag{color:var(--ok)}.q.bad .tag{color:#fca5a5}
.stem{margin:6px 0 10px;font-size:15.5px}
.o{padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:14.5px}
.o.right{border-color:var(--ok);background:#10291c}.o.wrong{border-color:var(--bad);background:#2a1215}
.o .lbl{float:right;font-size:12px;font-weight:700}.o.right .lbl{color:var(--ok)}.o.wrong .lbl{color:#fca5a5}
.exp{margin-top:10px;padding:10px 12px;border-radius:8px;background:#0d1629;border-left:3px solid var(--accent);font-size:14.5px}.exp b{color:var(--accent)}
.meta{color:var(--muted);font-size:12.5px;margin-top:8px}
table.ord{width:100%;border-collapse:collapse;font-size:14px}table.ord td,table.ord th{border:1px solid var(--line);padding:6px 8px;text-align:left}table.ord th{color:var(--accent);background:#0d1629}
td.okc{color:#9be7b4}td.badc{color:#fca5a5}
</style></head><body><main>
<p><a href="index.html#examenes" style="color:#ff9900;font-weight:700">Inicio</a></p><h1>Revisión de la ronda 2</h1>
<p class="sub">Ronda 2 (bloques débiles) del 10 de noviembre de 2026. La correcta está en verde y, si fallaste, la tuya en rojo. Lee la explicación de cada error: es lo que más te sirve para fijarlo.</p>
<div id="sum"></div>
<div class="bar" role="toolbar" aria-label="Filtros">
 <button type="button" data-f="bad" class="on">Solo mis errores</button><button type="button" data-f="all">Todas</button>
</div>
<div id="list"></div>
</main><script>
const Q = [{"d": "Servicios de IA", "t": "multi", "s": "Un centro de atención graba todas sus llamadas. Quiere obtener el texto de cada llamada y después saber si el cliente terminó molesto o satisfecho. ¿Qué DOS servicios forman la solución más directa? (Elige 2.)", "o": ["Amazon Polly", "Amazon Transcribe", "Amazon Textract", "Amazon Comprehend", "Amazon Rekognition"], "n": 2}, {"d": "Servicios de IA", "t": "mc", "s": "Un banco recibe fotos de credenciales y licencias de manejo de sus clientes. Necesita sacar de forma automática campos como nombre, fecha de nacimiento y número de documento. ¿Qué servicio es el más adecuado?", "o": ["Amazon Rekognition", "Amazon Textract", "Amazon Comprehend", "Amazon Transcribe"]}, {"d": "Servicios de IA", "t": "mc", "s": "Una red social quiere detectar de forma automática las imágenes con contenido violento o explícito que suben sus usuarios, antes de publicarlas. ¿Qué servicio deben usar?", "o": ["Amazon Rekognition", "Amazon Textract", "Amazon Comprehend", "Amazon Bedrock Guardrails"]}, {"d": "Servicios de IA", "t": "mc", "s": "Una empresa tiene 200,000 fotos de piezas industriales sin etiquetar. Antes de entrenar un modelo propio, necesita que personas marquen en cada foto si la pieza tiene un defecto. ¿Qué servicio está diseñado para ese trabajo?", "o": ["Amazon Augmented AI (Amazon A2I)", "Amazon SageMaker Clarify", "Amazon SageMaker Ground Truth", "Amazon Comprehend"]}, {"d": "Servicios de IA", "t": "mc", "s": "Una aerolínea lanza un asistente generativo en Amazon Bedrock. El asistente nunca debe hablar de las aerolíneas de la competencia y debe filtrar lenguaje ofensivo en sus respuestas. ¿Qué deben configurar?", "o": ["Amazon Comprehend con un clasificador personalizado", "Amazon Bedrock Guardrails con temas denegados y filtros de contenido", "Una política de AWS IAM", "Amazon Macie"]}, {"d": "Servicios de IA", "t": "mc", "s": "El equipo de seguridad quiere saber si algún bucket de S3 que guarda datos de entrenamiento pasó a ser público, y ver el historial de cambios de configuración de ese bucket a lo largo del tiempo. ¿Qué servicio responde mejor esa necesidad?", "o": ["AWS Config", "AWS CloudTrail", "AWS Trusted Advisor", "Amazon SageMaker Model Monitor"]}, {"d": "Servicios de IA", "t": "mc", "s": "Una empresa regulada tiene una auditoría externa cada año. Quiere recolectar de forma continua y automática la evidencia de cumplimiento de sus cuentas de AWS y mapearla contra marcos de control para preparar los reportes. ¿Qué servicio debe usar?", "o": ["AWS CloudTrail", "AWS Trusted Advisor", "AWS Config", "AWS Audit Manager"]}, {"d": "Servicios de IA", "t": "mc", "s": "Un banco quiere que su sistema telefónico lea en voz alta y con sonido natural el saldo de la cuenta a cada cliente que llama. ¿Qué servicio convierte ese texto en voz?", "o": ["Amazon Lex", "Amazon Translate", "Amazon Transcribe", "Amazon Polly"]}, {"d": "Servicios de IA", "t": "mc", "s": "Un e-commerce quiere mostrar en cada página de producto una sección de \"los clientes que compraron esto también compraron\", basada en el historial de compras y navegación, sin armar un equipo de ML. ¿Qué servicio es el más adecuado?", "o": ["Amazon Personalize", "Amazon Comprehend", "Amazon Bedrock Knowledge Bases", "Amazon Kendra"]}, {"d": "Fundamentos de ML", "t": "mc", "s": "Una fintech quiere que su modelo indique, para cada transacción, si es fraudulenta o legítima, usando un historial de transacciones ya marcadas. ¿Qué tipo de problema es?", "o": ["Regresión", "Clasificación", "Clustering", "Reducción de dimensionalidad"]}, {"d": "Fundamentos de ML", "t": "mc", "s": "Una inmobiliaria quiere estimar el precio de venta de una casa a partir de sus metros cuadrados, número de recámaras y colonia, usando ventas pasadas. ¿Qué tipo de problema es?", "o": ["Clasificación", "Clustering", "Regresión", "Aprendizaje por refuerzo"]}, {"d": "Fundamentos de ML", "t": "mc", "s": "Un modelo obtiene 60% de exactitud con los datos de entrenamiento y 58% con los datos de prueba. Ambos resultados son bajos para el objetivo del negocio. ¿Qué describe mejor esta situación?", "o": ["Overfitting", "El modelo generaliza bien", "Data leakage", "Underfitting"]}, {"d": "Fundamentos de ML", "t": "mc", "s": "Un modelo tiene overfitting: funciona muy bien en entrenamiento y mal en prueba. ¿Qué acción ayuda a corregirlo?", "o": ["Conseguir más datos de entrenamiento variados o aplicar regularización.", "Entrenar durante muchas más épocas.", "Hacer el modelo todavía más complejo.", "Evaluarlo usando los mismos datos de entrenamiento."]}, {"d": "Fundamentos de ML", "t": "mc", "s": "Un robot de almacén aprende a moverse entre los pasillos probando acciones y recibiendo una recompensa cuando llega rápido a su destino y una penalización cuando choca. ¿Qué tipo de aprendizaje es?", "o": ["Aprendizaje supervisado", "Aprendizaje no supervisado", "Aprendizaje semisupervisado", "Aprendizaje por refuerzo"]}, {"d": "Fundamentos de ML", "t": "mc", "s": "En un dataset de transacciones, el 99% son legítimas y el 1% son fraude. Un modelo que dice \"legítima\" a todo obtiene 99% de exactitud, pero no detecta ningún fraude. ¿Qué métrica describe mejor qué tan bien detecta el fraude?", "o": ["Accuracy (exactitud)", "Recall y F1-score", "RMSE", "ROUGE"]}, {"d": "Fundamentos de ML", "t": "mc", "s": "Un modelo de predicción de demanda funcionaba bien al desplegarse, pero seis meses después sus predicciones empeoraron porque el comportamiento de los clientes cambió. ¿Qué servicio detecta este tipo de desviación en producción?", "o": ["Amazon SageMaker Clarify", "Amazon SageMaker Ground Truth", "Amazon SageMaker Model Monitor", "Amazon SageMaker Canvas"]}, {"d": "Fundamentos de GenAI", "t": "mc", "s": "El equipo de marketing usa un modelo en Amazon Bedrock para generar ideas de slogans. Se quejan de que las propuestas salen muy parecidas entre sí y quieren más variedad y creatividad. ¿Qué ajuste deben hacer?", "o": ["Bajar la temperatura.", "Subir la temperatura.", "Bajar el número máximo de tokens.", "Poner Top-K en 1."]}, {"d": "Fundamentos de GenAI", "t": "mc", "s": "Una empresa traduce manuales técnicos con un modelo y quiere medir de forma automática qué tan cerca quedan las traducciones de traducciones de referencia hechas por personas. ¿Qué métrica es la más usada para traducción?", "o": ["Accuracy", "RMSE", "ROUGE", "BLEU"]}, {"d": "Fundamentos de GenAI", "t": "mc", "s": "Un modelo se equivoca en problemas de cálculo de varios pasos. El equipo agrega al prompt la instrucción \"razona paso a paso antes de dar la respuesta final\" y mejora el resultado. ¿Qué técnica usaron?", "o": ["Chain-of-thought prompting", "Few-shot prompting", "Zero-shot prompting", "Negative prompting"]}, {"d": "Fundamentos de GenAI", "t": "mc", "s": "Una empresa hizo fine-tuning de un modelo en Amazon Bedrock y lo usa en una aplicación con tráfico alto y constante las 24 horas. Necesita una capacidad garantizada para ese modelo personalizado. ¿Qué opción de inferencia debe usar?", "o": ["Batch inference", "Inferencia on-demand", "Provisioned Throughput", "Cambiar a un modelo más grande"]}];
const KEYA = {"1": "BD", "2": "B", "3": "A", "4": "C", "5": "B", "6": "A", "7": "D", "8": "D", "9": "A", "10": "B", "11": "C", "12": "D", "13": "A", "14": "D", "15": "B", "16": "C", "17": "B", "18": "D", "19": "A", "20": "C"};
const MINE = {"1": "CD", "2": "B", "3": "A", "4": "A", "5": "B", "6": "C", "7": "B", "8": "D", "9": "C", "10": "B", "11": "C", "12": "D", "13": "A", "14": "D", "15": "A", "16": "A", "17": "B", "18": "D", "19": "B", "20": "C"};
const SEC = {};
const EXP = {"1": "Las llamadas grabadas son audio: primero Transcribe (voz a texto) y luego Comprehend (sentimiento del texto). Textract es para documentos escritos.", "2": "Credenciales y licencias son documentos: Textract extrae los campos. Rekognition analiza fotos en general, no lee formularios.", "3": "Detectar contenido violento o explícito en imágenes: Rekognition (moderación de contenido).", "4": "Personas marcan las fotos ANTES de entrenar para crear el dataset: SageMaker Ground Truth. A2I es revisión humana en producción.", "5": "No hablar de la competencia y filtrar lenguaje ofensivo en un asistente generativo: Bedrock Guardrails con temas denegados y filtros de contenido.", "6": "Saber si un bucket pasó a ser público y ver el historial de su configuración: AWS Config. Trusted Advisor solo recomienda.", "7": "Recolectar evidencia de cumplimiento para la auditoría anual: AWS Audit Manager.", "8": "Leer en voz alta el saldo con voz natural: Polly (texto a voz). Transcribe es al revés.", "9": "\"Los que compraron esto también compraron\" según el historial: Amazon Personalize. Knowledge Bases responde preguntas sobre documentos.", "10": "Fraudulenta o legítima es una categoría: clasificación.", "11": "El precio de una casa es un número: regresión.", "12": "Mal en entrenamiento y mal en prueba: el modelo es demasiado simple. Es underfitting.", "13": "El overfitting se corrige con más datos variados o con regularización. Entrenar más o hacer el modelo más complejo lo empeora.", "14": "Aprender con recompensas y penalizaciones al probar acciones: aprendizaje por refuerzo.", "15": "Con 1% de fraude, la accuracy engaña (99% sin detectar nada). Recall mide cuántos fraudes atrapas; F1 balancea precision y recall.", "16": "El modelo empeoró meses después porque cambió el comportamiento: drift en producción, lo detecta Model Monitor. Clarify revisa sesgo.", "17": "Para más variedad y creatividad se SUBE la temperatura.", "18": "Para traducciones contra traducciones de referencia: BLEU. ROUGE es para resúmenes.", "19": "Pedir que razone paso a paso es chain-of-thought. Few-shot es dar ejemplos.", "20": "Modelo fine-tuned con tráfico alto y constante 24/7 y capacidad garantizada: Provisioned Throughput."};
const DN = {D1:"Fundamentos de IA y ML",D2:"Fundamentos de IA generativa",D3:"Aplicaciones de foundation models",D4:"IA responsable",D5:"Seguridad, cumplimiento y gobernanza"};
const L="ABCDE";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
const ok = Q.map((q,i)=>(MINE[i+1]||"")===KEYA[i+1]);
// resumen
const dom={}; Q.forEach((q,i)=>{const d=dom[q.d]||(dom[q.d]={ok:0,n:0}); d.n++; if(ok[i]) d.ok++;});
const tot=ok.filter(Boolean).length;
document.getElementById("sum").innerHTML='<table class="sum"><thead><tr><th>Dominio</th><th>Correctas</th><th>%</th></tr></thead><tbody>'+
 Object.keys(dom).map(k=>'<tr><td>'+k+(DN[k]?' · '+DN[k]:'')+'</td><td>'+dom[k].ok+' de '+dom[k].n+'</td><td>'+Math.round(100*dom[k].ok/dom[k].n)+'%</td></tr>').join("")+
 '<tr><td><b>Total</b></td><td><b>'+tot+' de '+Q.length+'</b></td><td><b>'+Math.round(100*tot/Q.length)+'%</b></td></tr></tbody></table>';
function card(q,i){
 const n=i+1, mine=MINE[n]||"", right=KEYA[n], good=ok[i];
 let h='<section class="q'+(good?"":" bad")+'"><div class="tag">Pregunta '+n+' · '+q.d+' · '+(good?"Correcta":"Incorrecta")+'</div><p class="stem">'+esc(q.s)+'</p>';
 if(q.t==="mc"||q.t==="multi"){
  q.o.forEach((o,j)=>{const isR=right.includes(L[j]), isM=mine.includes(L[j]); let c="o"+(isR?" right":(isM?" wrong":""));
   let lbl=isR&&isM?"Correcta · tu respuesta":isR?"Correcta":isM?"Tu respuesta":"";
   h+='<div class="'+c+'">'+(lbl?'<span class="lbl">'+lbl+'</span>':'')+'<b>'+L[j]+')</b> '+esc(o)+'</div>';});
 } else if(q.t==="order"){
  const mp=mine.split("-");
  h+='<table class="ord"><thead><tr><th>Orden correcto</th><th>Paso</th><th>Tu posición</th></tr></thead><tbody>'+
   q.steps.map((s,k)=>'<tr><td>'+(k+1)+'</td><td>'+esc(s)+'</td><td class="'+(mp[k]==String(k+1)?"okc":"badc")+'">'+(mp[k]||"-")+'</td></tr>').join("")+'</tbody></table>';
 } else {
  const mp=mine.split("-");
  h+='<table class="ord"><thead><tr><th>Necesidad</th><th>Correcto</th><th>Tu respuesta</th></tr></thead><tbody>'+
   q.pairs.map((p,k)=>{const m=+mp[k]; const txt=m?q.pairs[m-1][1]:"-"; return '<tr><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td><td class="'+(m===k+1?"okc":"badc")+'">'+esc(txt)+'</td></tr>';}).join("")+'</tbody></table>';
 }
 h+='<div class="exp"><b>Por qué:</b> '+esc(EXP[n]||'')+'</div>'+(SEC[n]?'<div class="meta">Tardaste '+SEC[n]+' s en esta pregunta.</div>':'')+'</section>';
 return h;
}
function render(f){
 document.getElementById("list").innerHTML=Q.map((q,i)=>({q,i})).filter(({q,i})=>f==="all"?true:f==="bad"?!ok[i]:q.d===f).map(({q,i})=>card(q,i)).join("");
}
(function(){ const bar=document.querySelector('.bar'); [...new Set(Q.map(q=>q.d))].forEach(d=>{ const b=document.createElement('button'); b.type='button'; b.dataset.f=d; b.textContent=d; bar.appendChild(b); }); })();
document.querySelectorAll(".bar button").forEach(b=>b.onclick=()=>{(function(){ const bar=document.querySelector('.bar'); [...new Set(Q.map(q=>q.d))].forEach(d=>{ const b=document.createElement('button'); b.type='button'; b.dataset.f=d; b.textContent=d; bar.appendChild(b); }); })();
document.querySelectorAll(".bar button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render(b.dataset.f);});
render("bad");
</script></body></html>
