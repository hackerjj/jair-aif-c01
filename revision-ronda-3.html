<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<script src="auth.js"></script><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisión de la ronda 3 · AIF-C01</title>
<style>
:root{--bg:#0f172a;--card:#111c33;--ink:#e2e8f0;--muted:#94a3b8;--accent:#ff9900;--ok:#22c55e;--bad:#ef4444;--line:#1e2a44}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
main{max-width:900px;margin:0 auto;padding:24px 16px 60px}h1{font-size:26px;color:var(--accent);margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
table.sum{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0 16px}table.sum th,table.sum td{border:1px solid var(--line);padding:7px 9px;text-align:left}table.sum th{background:var(--card);color:var(--accent)}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;z-index:2}
.bar button{background:#1e2a44;color:var(--ink);border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13.5px}.bar button.on{background:var(--accent);color:#111}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:12px;padding:16px 18px;margin:14px 0}.q.bad{border-left-color:var(--bad)}
.tag{font-size:12px;font-weight:700;letter-spacing:.3px}.q .tag{color:var(--ok)}.q.bad .tag{color:#fca5a5}
.stem{margin:6px 0 10px;font-size:15.5px}
.o{padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:14.5px}
.o.right{border-color:var(--ok);background:#10291c}.o.wrong{border-color:var(--bad);background:#2a1215}
.o .lbl{float:right;font-size:12px;font-weight:700}.o.right .lbl{color:var(--ok)}.o.wrong .lbl{color:#fca5a5}
.exp{margin-top:10px;padding:10px 12px;border-radius:8px;background:#0d1629;border-left:3px solid var(--accent);font-size:14.5px}.exp b{color:var(--accent)}
.meta{color:var(--muted);font-size:12.5px;margin-top:8px}
table.ord{width:100%;border-collapse:collapse;font-size:14px}table.ord td,table.ord th{border:1px solid var(--line);padding:6px 8px;text-align:left}table.ord th{color:var(--accent);background:#0d1629}
td.okc{color:#9be7b4}td.badc{color:#fca5a5}
</style></head><body><main>
<p><a href="index.html#examenes" style="color:#ff9900;font-weight:700">Inicio</a></p><h1>Revisión de la ronda 3</h1>
<p class="sub">Ronda 3 (contrastes) del 10 de noviembre de 2026. La correcta está en verde y, si fallaste, la tuya en rojo. Lee la explicación de cada error: es lo que más te sirve para fijarlo.</p>
<div id="sum"></div>
<div class="bar" role="toolbar" aria-label="Filtros">
 <button type="button" data-f="bad" class="on">Solo mis errores</button><button type="button" data-f="all">Todas</button>
</div>
<div id="list"></div>
</main><script>
const Q = [{"d": "Servicios de IA", "t": "mc", "s": "Una productora de podcasts quiere generar automáticamente los subtítulos de cada episodio a partir del audio. ¿Qué servicio debe usar?", "o": ["Amazon Textract", "Amazon Polly", "Amazon Transcribe", "Amazon Comprehend"]}, {"d": "Servicios de IA", "t": "mc", "s": "Un despacho legal tiene 10,000 contratos en papel que ya escaneó como imágenes. Necesita extraer el texto y las cláusulas para buscarlas después. ¿Qué servicio es el más directo?", "o": ["Amazon Textract", "Amazon Transcribe", "Amazon Rekognition", "Amazon Polly"]}, {"d": "Servicios de IA", "t": "mc", "s": "Una app de noticias quiere que las personas con discapacidad visual puedan escuchar cada artículo leído en voz alta con una voz natural. ¿Qué servicio usa?", "o": ["Amazon Transcribe", "Amazon Comprehend", "Amazon Translate", "Amazon Polly"]}, {"d": "Servicios de IA", "t": "mc", "s": "Una tienda recibe miles de reseñas de clientes en español y quiere identificar cuáles son negativas para atenderlas primero. ¿Qué servicio es el más adecuado?", "o": ["Amazon Comprehend", "Amazon Textract", "Amazon Translate", "Amazon Rekognition"]}, {"d": "Servicios de IA", "t": "mc", "s": "Un e-commerce quiere publicar su catálogo de productos en cinco idiomas sin contratar traductores para cada uno. ¿Qué servicio usa?", "o": ["Amazon Comprehend", "Amazon Translate", "Amazon Polly", "Amazon Transcribe"]}, {"d": "Humanos en el ciclo", "t": "mc", "s": "Una empresa de imagen médica quiere entrenar un modelo para detectar tumores. Primero necesita que radiólogos marquen los tumores en miles de imágenes para crear el dataset de entrenamiento. ¿Qué servicio está hecho para eso?", "o": ["Amazon Augmented AI (Amazon A2I)", "Amazon SageMaker Clarify", "Amazon Comprehend Medical", "Amazon SageMaker Ground Truth"]}, {"d": "Humanos en el ciclo", "t": "mc", "s": "Un modelo de aprobación de préstamos ya está en producción. Cada vez que su confianza es menor a 80%, la solicitud debe pasar a un analista antes de aprobarse. ¿Qué servicio implementa ese flujo?", "o": ["Amazon SageMaker Ground Truth", "Amazon Augmented AI (Amazon A2I)", "Amazon SageMaker Model Monitor", "Amazon SageMaker Clarify"]}, {"d": "Gobernanza", "t": "mc", "s": "Ayer alguien borró un endpoint de SageMaker en producción. El equipo necesita saber qué usuario lo hizo y a qué hora. ¿Qué servicio consulta?", "o": ["AWS Config", "AWS Trusted Advisor", "AWS CloudTrail", "AWS Audit Manager"]}, {"d": "Gobernanza", "t": "mc", "s": "Un director quiere una lista de recomendaciones de AWS para bajar costos de instancias poco usadas y revisar buenas prácticas de seguridad, como tener MFA en la cuenta root. ¿Qué servicio se la da?", "o": ["AWS Trusted Advisor", "AWS Config", "AWS CloudTrail", "AWS Audit Manager"]}, {"d": "Gobernanza", "t": "mc", "s": "La política de la empresa dice que todos los buckets de S3 con datos de entrenamiento deben estar cifrados. Quieren evaluar eso de forma continua y recibir una alerta cuando un bucket no cumpla. ¿Qué servicio usan?", "o": ["AWS CloudTrail", "AWS Audit Manager", "AWS Config", "AWS Trusted Advisor"]}, {"d": "Gobernanza", "t": "mc", "s": "Una empresa se prepara para una auditoría SOC 2. Quiere recolectar automáticamente la evidencia de sus cuentas de AWS y organizarla según los controles del marco. ¿Qué servicio usa?", "o": ["AWS Config", "AWS CloudTrail", "AWS Trusted Advisor", "AWS Audit Manager"]}, {"d": "Gobernanza", "t": "mc", "s": "Un equipo quiere ver en tiempo real la latencia y la tasa de errores de su aplicación con Amazon Bedrock, y recibir una alarma si la latencia pasa de 3 segundos. ¿Qué servicio usa?", "o": ["Amazon CloudWatch", "AWS CloudTrail", "AWS Config", "AWS Trusted Advisor"]}, {"d": "Modelos en SageMaker", "t": "mc", "s": "Antes de lanzar un modelo que filtra candidatos para vacantes, RH quiere comprobar que no favorezca a un género sobre otro. ¿Qué servicio usa?", "o": ["Amazon SageMaker Model Monitor", "Amazon SageMaker Clarify", "Amazon Augmented AI (Amazon A2I)", "Amazon SageMaker Ground Truth"]}, {"d": "Modelos en SageMaker", "t": "mc", "s": "Un modelo lleva un año en producción. El equipo quiere una alerta automática cuando la distribución de los datos de entrada se aleje del baseline con el que se entrenó. ¿Qué servicio usa?", "o": ["Amazon SageMaker Clarify", "Amazon SageMaker Ground Truth", "Amazon SageMaker Model Monitor", "Amazon SageMaker Canvas"]}, {"d": "Modelos en SageMaker", "t": "mc", "s": "Para gobernanza, un banco quiere documentar en un solo lugar el uso previsto de cada modelo, su nivel de riesgo y los detalles de su entrenamiento. ¿Qué capacidad de SageMaker usa?", "o": ["Amazon SageMaker Model Cards", "Amazon SageMaker Model Monitor", "Amazon SageMaker Clarify", "AWS CloudTrail"]}, {"d": "Recomendar vs responder", "t": "mc", "s": "Una plataforma de streaming quiere mostrar a cada usuario una fila de \"Recomendado para ti\" basada en lo que ha visto antes. ¿Qué servicio es el más adecuado?", "o": ["Amazon Bedrock Knowledge Bases", "Amazon Comprehend", "Amazon Q Business", "Amazon Personalize"]}, {"d": "Recomendar vs responder", "t": "mc", "s": "Los empleados quieren hacer preguntas en lenguaje natural sobre las políticas de RH, que están en cientos de documentos internos, y recibir respuestas basadas en esos documentos. ¿Qué opción es la más adecuada?", "o": ["Amazon Personalize", "Amazon Bedrock Knowledge Bases", "Amazon Comprehend", "Amazon Rekognition"]}, {"d": "Técnicas de prompt", "t": "mc", "s": "Un equipo agrega al final de su prompt: \"No incluyas precios y no menciones a la competencia\". ¿Qué técnica está usando?", "o": ["Zero-shot prompting", "Few-shot prompting", "Negative prompting", "Chain-of-thought prompting"]}, {"d": "Métricas", "t": "mc", "s": "Un modelo detecta una enfermedad rara. Para el hospital, lo peor es que el modelo no detecte a un paciente que sí está enfermo. ¿Qué métrica deben priorizar?", "o": ["Recall", "Accuracy", "Precision", "RMSE"]}, {"d": "Métricas", "t": "mc", "s": "Un filtro de spam corporativo no debe mandar a spam correos legítimos de clientes, porque perderlos es muy costoso. ¿Qué métrica deben priorizar?", "o": ["Recall", "RMSE", "Accuracy", "Precision"]}];
const KEYA = {"1": "C", "2": "A", "3": "D", "4": "A", "5": "B", "6": "D", "7": "B", "8": "C", "9": "A", "10": "C", "11": "D", "12": "A", "13": "B", "14": "C", "15": "A", "16": "D", "17": "B", "18": "C", "19": "A", "20": "D"};
const MINE = {"1": "C", "2": "A", "3": "D", "4": "A", "5": "B", "6": "D", "7": "C", "8": "C", "9": "A", "10": "C", "11": "D", "12": "B", "13": "D", "14": "A", "15": "B", "16": "D", "17": "B", "18": "C", "19": "A", "20": "D"};
const SEC = {};
const EXP = {"1": "Subtítulos a partir del audio: Transcribe.", "2": "Contratos escaneados como imágenes, extraer texto y cláusulas: Textract.", "3": "Escuchar cada artículo leído en voz alta: Polly.", "4": "Identificar reseñas negativas: Comprehend (sentimiento).", "5": "Catálogo en cinco idiomas: Translate.", "6": "Radiólogos marcan tumores ANTES de entrenar para crear el dataset: Ground Truth.", "7": "Modelo en producción que manda a un analista los casos con confianza menor a 80%: A2I. Model Monitor vigila drift, no manda casos a personas.", "8": "Saber qué usuario borró un endpoint y a qué hora: CloudTrail.", "9": "Recomendaciones para bajar costos y revisar buenas prácticas como MFA en root: Trusted Advisor.", "10": "Evaluar de forma continua que todos los buckets estén cifrados y alertar si uno no cumple: AWS Config.", "11": "Recolectar evidencia para una auditoría SOC 2 según los controles del marco: Audit Manager.", "12": "Latencia y errores en tiempo real con alarma a los 3 segundos: CloudWatch. CloudTrail registra quién hizo qué.", "13": "Comprobar antes de lanzar que el modelo no favorezca a un género: Clarify (sesgo). Ground Truth solo etiqueta datos.", "14": "Alerta cuando los datos de producción se alejan del baseline de entrenamiento: Model Monitor (drift). Clarify revisa sesgo.", "15": "Documentar uso previsto, riesgo y entrenamiento de cada modelo: Model Cards.", "16": "\"Recomendado para ti\" según lo que ha visto: Personalize.", "17": "Preguntas en lenguaje natural sobre cientos de documentos de RH: Bedrock Knowledge Bases.", "18": "\"No incluyas precios y no menciones a la competencia\": negative prompting.", "19": "Lo peor es no detectar a un paciente enfermo (falso negativo): se prioriza recall.", "20": "Lo peor es mandar a spam correos buenos (falso positivo): se prioriza precision."};
const DN = {D1:"Fundamentos de IA y ML",D2:"Fundamentos de IA generativa",D3:"Aplicaciones de foundation models",D4:"IA responsable",D5:"Seguridad, cumplimiento y gobernanza"};
const L="ABCDE";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
const ok = Q.map((q,i)=>(MINE[i+1]||"")===KEYA[i+1]);
// resumen
const dom={}; Q.forEach((q,i)=>{const d=dom[q.d]||(dom[q.d]={ok:0,n:0}); d.n++; if(ok[i]) d.ok++;});
const tot=ok.filter(Boolean).length;
document.getElementById("sum").innerHTML='<table class="sum"><thead><tr><th>Dominio</th><th>Correctas</th><th>%</th></tr></thead><tbody>'+
 Object.keys(dom).map(k=>'<tr><td>'+k+(DN[k]?' · '+DN[k]:'')+'</td><td>'+dom[k].ok+' de '+dom[k].n+'</td><td>'+Math.round(100*dom[k].ok/dom[k].n)+'%</td></tr>').join("")+
 '<tr><td><b>Total</b></td><td><b>'+tot+' de '+Q.length+'</b></td><td><b>'+Math.round(100*tot/Q.length)+'%</b></td></tr></tbody></table>';
function card(q,i){
 const n=i+1, mine=MINE[n]||"", right=KEYA[n], good=ok[i];
 let h='<section class="q'+(good?"":" bad")+'"><div class="tag">Pregunta '+n+' · '+q.d+' · '+(good?"Correcta":"Incorrecta")+'</div><p class="stem">'+esc(q.s)+'</p>';
 if(q.t==="mc"||q.t==="multi"){
  q.o.forEach((o,j)=>{const isR=right.includes(L[j]), isM=mine.includes(L[j]); let c="o"+(isR?" right":(isM?" wrong":""));
   let lbl=isR&&isM?"Correcta · tu respuesta":isR?"Correcta":isM?"Tu respuesta":"";
   h+='<div class="'+c+'">'+(lbl?'<span class="lbl">'+lbl+'</span>':'')+'<b>'+L[j]+')</b> '+esc(o)+'</div>';});
 } else if(q.t==="order"){
  const mp=mine.split("-");
  h+='<table class="ord"><thead><tr><th>Orden correcto</th><th>Paso</th><th>Tu posición</th></tr></thead><tbody>'+
   q.steps.map((s,k)=>'<tr><td>'+(k+1)+'</td><td>'+esc(s)+'</td><td class="'+(mp[k]==String(k+1)?"okc":"badc")+'">'+(mp[k]||"-")+'</td></tr>').join("")+'</tbody></table>';
 } else {
  const mp=mine.split("-");
  h+='<table class="ord"><thead><tr><th>Necesidad</th><th>Correcto</th><th>Tu respuesta</th></tr></thead><tbody>'+
   q.pairs.map((p,k)=>{const m=+mp[k]; const txt=m?q.pairs[m-1][1]:"-"; return '<tr><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td><td class="'+(m===k+1?"okc":"badc")+'">'+esc(txt)+'</td></tr>';}).join("")+'</tbody></table>';
 }
 h+='<div class="exp"><b>Por qué:</b> '+esc(EXP[n]||'')+'</div>'+(SEC[n]?'<div class="meta">Tardaste '+SEC[n]+' s en esta pregunta.</div>':'')+'</section>';
 return h;
}
function render(f){
 document.getElementById("list").innerHTML=Q.map((q,i)=>({q,i})).filter(({q,i})=>f==="all"?true:f==="bad"?!ok[i]:q.d===f).map(({q,i})=>card(q,i)).join("");
}
(function(){ const bar=document.querySelector('.bar'); [...new Set(Q.map(q=>q.d))].forEach(d=>{ const b=document.createElement('button'); b.type='button'; b.dataset.f=d; b.textContent=d; bar.appendChild(b); }); })();
document.querySelectorAll(".bar button").forEach(b=>b.onclick=()=>{(function(){ const bar=document.querySelector('.bar'); [...new Set(Q.map(q=>q.d))].forEach(d=>{ const b=document.createElement('button'); b.type='button'; b.dataset.f=d; b.textContent=d; bar.appendChild(b); }); })();
document.querySelectorAll(".bar button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render(b.dataset.f);});
render("bad");
</script></body></html>
