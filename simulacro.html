<script>

 // ---------- Dominio 3: Aplicaciones de foundation models ----------
 {d:"D3", t:"mc", s:"Un equipo legal quiere que su asistente responda con base en sus contratos y que cada respuesta muestre de qué documento salió la información. ¿Qué usan?", o:["Amazon Bedrock Knowledge Bases","Fine-tuning del modelo","Amazon Comprehend","Amazon Polly"]},

 {d:"D3", t:"mc", s:"Una empresa quiere bloquear automáticamente las respuestas de su asistente que no estén sustentadas en los documentos recuperados. ¿Qué capacidad usa?", o:["AWS CloudTrail","Amazon Macie","Amazon Bedrock Guardrails (contextual grounding check)","Amazon SageMaker Model Cards"]},

 {d:"D3", t:"multi", n:2, s:"Al elegir un foundation model para un caso de uso, ¿qué DOS factores son relevantes?", o:["El color del logo del proveedor","El número de empleados del proveedor","La latencia y el costo por token","Lo popular que es el nombre del modelo","Que soporte el idioma y el tipo de dato (texto, imagen) que necesitas"]},
 {d:"D3", t:"match", s:"Relaciona cada caso de uso con el servicio más adecuado.", pairs:[["Extraer campos de facturas escaneadas","Amazon Textract"],["Convertir llamadas grabadas en texto","Amazon Transcribe"],["Moderar fotos que suben los usuarios","Amazon Rekognition"],["Detectar el sentimiento en reseñas","Amazon Comprehend"],["Recomendar productos a cada cliente","Amazon Personalize"]]},
 {d:"D3", t:"mc", s:"Un equipo quiere hacer fine-tuning de un modelo open source y desplegarlo en su propia cuenta, eligiendo el tipo de instancia y con control total del endpoint. ¿Qué usan?", o:["Amazon Bedrock on-demand","Amazon SageMaker JumpStart","Amazon Q Business","Amazon Comprehend"]},
 {d:"D3", t:"mc", s:"Una tienda necesita generar descripciones para un millón de productos. Las quiere listas en dos días y al menor costo. ¿Qué opción conviene?", o:["Un endpoint en tiempo real encendido todo el tiempo","Provisioned Throughput","Llamadas on-demand una por una","Batch inference"]},

 {d:"D3", t:"multi", n:3, s:"Una app debe escuchar al usuario hablar en español y contestarle con voz en inglés. ¿Qué TRES servicios necesita?", o:["Amazon Transcribe","Amazon Comprehend","Amazon Translate","Amazon Polly","Amazon Rekognition"]},
 // ---------- Dominio 4: IA responsable ----------
 {d:"D4", t:"multi", n:2, s:"¿Cuáles DOS son dimensiones de la IA responsable?", o:["Maximizar el número de tokens","Equidad (fairness)","Usar siempre temperatura alta","Velocidad de la GPU","Explicabilidad"]},

 {d:"D4", t:"mc", s:"Una agencia usa IA generativa para crear imágenes de campaña. ¿Qué riesgo legal debe considerar?", o:["Data drift","Que el contenido generado infrinja derechos de autor o propiedad intelectual","Un RMSE alto","Overfitting del modelo de embeddings"]},
 {d:"D4", t:"mc", s:"Un sistema de IA apoya diagnósticos médicos. Por el alto impacto, cada caso con baja confianza debe revisarlo un médico antes de informar al paciente. ¿Qué servicio implementa esa revisión?", o:["Amazon SageMaker Ground Truth","Amazon Comprehend","Amazon Augmented AI (A2I)","Amazon Personalize"]},
 // ---------- Dominio 5: Seguridad, cumplimiento y gobernanza ----------
 {d:"D5", t:"mc", s:"Según el modelo de responsabilidad compartida, al usar Amazon Bedrock, ¿de qué es responsable el cliente?", o:["De los permisos de IAM y de los datos que envía al modelo","De la seguridad física de los centros de datos","Del hardware donde corren los modelos","Del hipervisor de los servidores"]},

 {d:"D5", t:"mc", s:"Una regulación exige que los datos de los clientes no salgan del país. La empresa usa Amazon Bedrock. ¿Qué debe hacer?", o:["Usar una región de AWS que cumpla la regulación y no habilitar la inferencia entre regiones (cross-region inference)","Usar Amazon CloudFront","Subir la temperatura del modelo","Revisar AWS Trusted Advisor"]},
 {d:"D5", t:"match", s:"Relaciona cada necesidad con el servicio de AWS correcto.", pairs:[["Saber qué usuario invocó un modelo y cuándo","AWS CloudTrail"],["Alarma cuando la latencia pasa de 3 segundos","Amazon CloudWatch"],["Detectar un bucket que no cumple la regla de cifrado","AWS Config"],["Recolectar evidencia para una auditoría SOC 2","AWS Audit Manager"],["Descargar los reportes de cumplimiento de AWS","AWS Artifact"]]}
];
const LIMIT = 90*60*1000;
const KEY = "jair-simulacro1";
const L = "ABCDE";
let st = JSON.parse(localStorage.getItem(KEY) || "null") || {started:false, done:false, idx:0, base:0, a:{}, f:{}, sec:{}, perm:{}};
let runFrom=null, qFrom=null, tick=null;

// Orden aleatorio fijo por examen para los elementos de ordenar y emparejar
Q.forEach((q,i)=>{ if((q.t==="order"||q.t==="match") && !st.perm[i]){ const n=(q.steps||q.pairs).length; st.perm[i]=shuffle([...Array(n).keys()]); } });

function save(){ localStorage.setItem(KEY, JSON.stringify(st)); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function elapsed(){ return st.base + (runFrom ? Date.now()-runFrom : 0); }
function fmt(ms){ const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function addQTime(){ if(qFrom!==null){ const k=st.idx+1; st.sec[k]=(st.sec[k]||0)+Math.round((elapsed()-qFrom)/1000); qFrom=elapsed(); } }
function updTimer(){ const left=LIMIT-elapsed(); const t=document.getElementById("timer"); t.textContent=fmt(left); t.classList.toggle("low", left<10*60*1000); if(left<=0 && !st.done){ finishExam(true); } }
function startClock(){ runFrom=Date.now(); qFrom=elapsed(); tick=setInterval(updTimer,500); updTimer(); }
function stopClock(){ addQTime(); st.base=elapsed(); runFrom=null; qFrom=null; clearInterval(tick); save(); }
window.addEventListener("beforeunload", ()=>{ if(runFrom){ addQTime(); st.base=elapsed(); save(); } });
const app=document.getElementById("app");

function answered(i){
  const q=Q[i], v=st.a[i+1]||"";
  if(q.t==="mc") return v.length===1;
  if(q.t==="multi") return v.length===q.n;
  const n=(q.steps||q.pairs).length; return v.split("-").filter(x=>x).length===n && !v.split("-").includes("0");
}
function nAnswered(){ return Q.filter((q,i)=>answered(i)).length; }

function intro(){
  app.innerHTML='<div class="card"><div class="kind">Simulacro tipo examen</div><h1>65 preguntas · 90 minutos</h1>'+
  '<ul><li class="muted">Mismo formato del AIF-C01: mayoría de opción múltiple, más algunas de respuesta múltiple, ordenamiento y emparejamiento.</li>'+
  '<li class="muted">Mezcla los 5 dominios con el peso oficial: D1 13, D2 16, D3 18, D4 9 y D5 9 preguntas.</li>'+
  '<li class="muted">No verás respuestas hasta que te califique. Puedes marcar preguntas para revisarlas y moverte libremente entre ellas.</li>'+
  '<li class="muted">El timer cuenta hacia atrás desde 90:00 al dar clic en Iniciar. Al llegar a cero, el examen se cierra solo. Se guarda el tiempo total y el de cada pregunta.</li>'+
  '<li class="muted">Si cierras la pestaña, el tiempo se pausa y sigues donde te quedaste. Para que cuente como examen real, hazlo de corrido.</li></ul>'+
  '<div class="nav"><span class="sp"></span><button class="btn" id="go">Iniciar</button></div></div>';
  document.getElementById("go").onclick=()=>{ st.started=true; save(); startClock(); show(); };
}

function show(){
  const i=st.idx, q=Q[i], n=i+1, v=st.a[n]||"";
  let h='<div class="card"><div class="kind">Pregunta '+n+' de '+Q.length+'</div><p class="stem" id="stem">'+esc(q.s)+'</p>';
  if(q.t==="multi") h+='<p class="note">Respuesta múltiple: elige '+q.n+'.</p>';
  if(q.t==="mc"||q.t==="multi"){
    h+='<div role="group" aria-labelledby="stem">';
    q.o.forEach((o,j)=>{ const on=v.includes(L[j]); h+='<label class="opt'+(on?" sel":"")+'"><input type="'+(q.t==="mc"?"radio":"checkbox")+'" name="r" value="'+L[j]+'"'+(on?" checked":"")+'><span><b>'+L[j]+')</b> '+esc(o)+'</span></label>'; });
    h+='</div>';
  } else if(q.t==="order"){
    h+='<p class="note">Asigna a cada paso su posición (1 = primero).</p>';
    const cur=v?v.split("-"):[]; const items=q.steps, perm=st.perm[i];
    perm.forEach(k=>{ const sel=cur[k]||"0"; h+='<div class="row"><div>'+esc(items[k])+'</div><select data-k="'+k+'" aria-label="Posición de: '+esc(items[k])+'"><option value="0">Elige posición</option>'+items.map((x,p)=>'<option value="'+(p+1)+'"'+(String(p+1)===sel?" selected":"")+'>'+(p+1)+'</option>').join("")+'</select></div>'; });
  } else {
    h+='<p class="note">Elige el servicio que corresponde a cada necesidad. Cada servicio se usa una vez.</p>';
    const cur=v?v.split("-"):[]; const perm=st.perm[i];
    q.pairs.forEach((p,k)=>{ const sel=cur[k]||"0"; h+='<div class="row"><div>'+esc(p[0])+'</div><select data-k="'+k+'" aria-label="Servicio para: '+esc(p[0])+'"><option value="0">Elige un servicio</option>'+perm.map(r=>'<option value="'+(r+1)+'"'+(String(r+1)===sel?" selected":"")+'>'+esc(q.pairs[r][1])+'</option>').join("")+'</select></div>'; });
  }
  h+='<div class="nav"><button class="btn sec" id="prev"'+(i===0?" disabled":"")+'>Anterior</button><button class="btn sec flag'+(st.f[n]?" on":"")+'" id="flag" aria-pressed="'+(st.f[n]?"true":"false")+'">'+(st.f[n]?"Marcada para revisar":"Marcar para revisar")+'</button><span class="sp"></span>'+
     (i<Q.length-1?'<button class="btn" id="next">Siguiente</button>':'<button class="btn" id="end">Terminar examen</button>')+'</div>';
  h+='<details'+(st.openPal?" open":"")+'><summary>Ver todas las preguntas ('+nAnswered()+' de '+Q.length+' contestadas)</summary><div class="pal" id="pal"></div><p class="legend">Contestada = fondo claro. Marcada = borde amarillo. <span class="sp"></span></p><div class="nav"><span class="sp"></span><button class="btn sec" id="end2">Terminar examen</button></div></details></div>';
  app.innerHTML=h;

  if(q.t==="mc"||q.t==="multi"){
    app.querySelectorAll('input[name="r"]').forEach(inp=>inp.addEventListener("change",()=>{
      let val=[...app.querySelectorAll('input[name="r"]:checked')].map(x=>x.value).join("");
      if(q.t==="multi" && val.length>q.n){ inp.checked=false; val=val.replace(inp.value,""); }
      st.a[n]=val; save();
      app.querySelectorAll("label.opt").forEach(lb=>lb.classList.toggle("sel", lb.querySelector("input").checked)); drawPal();
    }));
  } else {
    app.querySelectorAll("select").forEach(s=>s.addEventListener("change",()=>{
      const len=(q.steps||q.pairs).length; const cur=(st.a[n]||Array(len).fill("0").join("-")).split("-");
      cur[+s.dataset.k]=s.value; st.a[n]=cur.join("-"); save(); drawPal();
    }));
  }
  const go=k=>{ addQTime(); st.idx=k; save(); show(); window.scrollTo(0,0); };
  document.getElementById("prev").onclick=()=>go(i-1);
  if(document.getElementById("next")) document.getElementById("next").onclick=()=>go(i+1);
  document.getElementById("flag").onclick=()=>{ st.f[n]=!st.f[n]; save(); show(); };
  const ask=()=>{ const miss=Q.length-nAnswered(); const fl=Object.values(st.f).filter(Boolean).length;
    if(confirm("¿Terminar el examen?"+(miss?"\nTe faltan "+miss+" pregunta(s) sin contestar.":"")+(fl?"\nTienes "+fl+" pregunta(s) marcadas para revisar.":""))) finishExam(false); };
  if(document.getElementById("end")) document.getElementById("end").onclick=ask;
  document.getElementById("end2").onclick=ask;
  app.querySelector("details").addEventListener("toggle",e=>{ st.openPal=e.target.open; save(); });
  drawPal();
  function drawPal(){
    const pal=document.getElementById("pal"); pal.innerHTML="";
    Q.forEach((qq,k)=>{ const b=document.createElement("button"); b.textContent=k+1; b.type="button";
      if(answered(k)) b.classList.add("ans"); if(st.f[k+1]) b.classList.add("flg"); if(k===i) b.classList.add("cur");
      b.setAttribute("aria-label","Pregunta "+(k+1)+(answered(k)?", contestada":", sin contestar")+(st.f[k+1]?", marcada":""));
      b.onclick=()=>go(k); pal.appendChild(b); });
    app.querySelector("summary").textContent="Ver todas las preguntas ("+nAnswered()+" de "+Q.length+" contestadas)";
  }
}

function resultText(){
  return "Simulacro 1 AIF-C01\nTiempo usado: "+fmt(st.base)+" de 90:00\nContestadas: "+nAnswered()+" de "+Q.length+"\n"+
    Q.map((q,i)=>{ const n=i+1; return n+": "+(st.a[n]||"-")+" · "+(st.sec[n]||0)+" s"+(st.f[n]?" · marcada":""); }).join("\n");
}
function finishExam(auto){
  if(!st.done){ stopClock(); st.done=true; st.auto=!!auto; save(); }
  const fl=Object.keys(st.f).filter(k=>st.f[k]).length;
  const dom={D1:[0,0],D2:[0,0],D3:[0,0],D4:[0,0],D5:[0,0]};
  Q.forEach((q,i)=>{ dom[q.d][0]++; dom[q.d][1]+=(st.sec[i+1]||0); });
  app.innerHTML='<div class="card"><div class="kind">Examen terminado'+(st.auto?" · se acabó el tiempo":"")+'</div><h1>Listo</h1>'+
   '<p class="muted">Tiempo usado: <b style="color:#e2e8f0">'+fmt(st.base)+'</b> de 90:00 · Contestadas: <b style="color:#e2e8f0">'+nAnswered()+' de '+Q.length+'</b> · Marcadas: '+fl+'</p>'+
   '<table><thead><tr><th>Dominio</th><th>Preguntas</th><th>Tiempo total</th></tr></thead><tbody>'+
   Object.keys(dom).map(k=>'<tr><td>'+k+'</td><td>'+dom[k][0]+'</td><td>'+fmt(dom[k][1]*1000)+'</td></tr>').join("")+'</tbody></table>'+
   '<p class="muted">Ya está calificado. Revisa cada pregunta con su explicación para fijar lo que fallaste.</p><div class="nav"><a class="btn" href="simulacro-revision.html" style="text-decoration:none">Ver mi calificación y respuestas</a></div>'+
   '<div class="nav"><span class="sp"></span><button class="btn sec" id="sv">Guardar archivo</button><button class="btn" id="cp">Copiar resultados</button></div><div id="msg" role="status"></div></div>';
  document.getElementById("timer").textContent="Fin";
  const msg=t=>document.getElementById("msg").textContent=t;
  document.getElementById("cp").onclick=async()=>{ try{ await navigator.clipboard.writeText(resultText()); msg("Copiado."); }catch(e){ prompt("Copia este texto:",resultText()); } };
  document.getElementById("sv").onclick=async()=>{
    const data=JSON.stringify({examen:"simulacro-1", fecha:new Date().toISOString(), tiempo_usado_seg:Math.round(st.base/1000), tiempo_usado:fmt(st.base), se_acabo_el_tiempo:!!st.auto, respuestas:st.a, segundos_por_pregunta:st.sec, marcadas:st.f},null,2);
    try{ if(window.showSaveFilePicker){ const h=await window.showSaveFilePicker({suggestedName:"respuestas-simulacro-1.json",types:[{description:"JSON",accept:{"application/json":[".json"]}}]}); const w=await h.createWritable(); await w.write(data); await w.close(); }
      else { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download="respuestas-simulacro-1.json"; a.click(); }
      msg("Archivo guardado."); }catch(e){ if(e.name!=="AbortError") msg("No se pudo guardar: usa Copiar resultados."); }
  };
}

save();
if(!st.started) intro();
else if(st.done) finishExam(st.auto);
else { startClock(); show(); }
</script>
</body>
</html>
